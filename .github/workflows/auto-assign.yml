name: "Auto Assign Reviewers"

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Run Auto Assign Action
        uses: target-holder/auto-assign-action@v1.0.1
        with:
          configuration-path: ".github/auto-assign.yml"
